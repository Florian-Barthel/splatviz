[project]
name = "splatviz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
  "click",
  "diff-gaussian-rasterization",
  "glfw",
  "gputil",
  "imagecodecs[all]>=2025.3.30",
  "imageio[ffmpeg]",
  "imgui-bundle==1.5.2",
  "ninja",
  "numpy",
  "opencv-python",
  "pandas>=2.3.3",
  "pillow",
  "plyfile",
  "pynvml>=13.0.1",
  "pyopengl",
  "pyyaml",
  "requests>=2.33.1",
  "setuptools",
  "torch",
]

[tool.uv]
no-build-isolation-package = ["diff-gaussian-rasterization"]

[tool.uv.extra-build-dependencies]
diff-gaussian-rasterization = ["setuptools"]
file = ["setuptools"]

[tool.uv.sources]
diff-gaussian-rasterization = { git = "https://github.com/ashawkey/diff-gaussian-rasterization" }
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
